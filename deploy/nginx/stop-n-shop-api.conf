# Public vhost for the API host — stop-n-shop-api.prakashsoftwares.com
#
# This host is already working in production; this file documents it so the whole
# edge configuration lives in the repo and can be rebuilt from scratch.
#
# The browser does NOT need this host once the UI vhost proxies same-origin /api
# (see stop-n-shop.conf). Keep it for Postman, integration tests, and webhooks.

server {
    listen 80;
    listen [::]:80;
    server_name stop-n-shop-api.prakashsoftwares.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stop-n-shop-api.prakashsoftwares.com;

    ssl_certificate     /etc/letsencrypt/live/stop-n-shop-api.prakashsoftwares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stop-n-shop-api.prakashsoftwares.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# NOTE: `GET https://stop-n-shop-api.prakashsoftwares.com/` returning 404 with an
# empty body is CORRECT — the API maps no route at /. Health-check /api/menu instead.
