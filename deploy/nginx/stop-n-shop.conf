# Public vhost for the UI host — stop-n-shop.prakashsoftwares.com
#
# Install as /etc/nginx/sites-available/stop-n-shop.conf, symlink into
# sites-enabled/, then: nginx -t && nginx -s reload
#
# WHY THIS FILE EXISTS
# --------------------
# This vhost must PROXY to the ui container (host port 3000). It must NOT serve a
# hand-built dist/ folder from disk.
#
# The ui container's own nginx (stopnshop-ui/nginx.conf) already contains the
# /api/ and /uploads/ proxies to the api container. Serving dist/ statically
# bypasses that nginx entirely, so /api/* hits the static file handler:
#   GET  /api/menu                  -> 200 text/html  (SPA fallback index.html)
#   POST /api/auth/buyer/register   -> 405 Not Allowed (can't POST to a static file)
# That is the exact production outage this config fixes.

server {
    listen 80;
    listen [::]:80;
    server_name stop-n-shop.prakashsoftwares.com;

    # Keep the ACME webroot reachable so certbot can renew over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stop-n-shop.prakashsoftwares.com;

    # Certbot normally manages these two lines. If this host already had a
    # working certificate, keep the paths that were there before.
    ssl_certificate     /etc/letsencrypt/live/stop-n-shop.prakashsoftwares.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stop-n-shop.prakashsoftwares.com/privkey.pem;

    # Product images can be large; the seller product wizard uploads them.
    client_max_body_size 25m;

    # Everything — the SPA, /api/, /uploads/ — goes to the ui container.
    # Do not add a `root` or a `location /api` here: the container handles both.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API's long-running report/dashboard queries outlive the 60s default.
        proxy_read_timeout 120s;
    }
}
