<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sns-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StopNShop — Premium Fashion & Lifestyle" />
    <title>StopNShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Theme FOUC guard — must run before React hydrates.
      // Default is LIGHT (not OS preference) — new visitors land in the warm cream
      // brand surface, and dark is opt-in only after sign-in.
      // Auth/onboarding flows are ALWAYS rendered light regardless of stored value
      // so previously-logged-in dark users see the brand identity on the login form.
      (function () {
        try {
          var path = window.location.pathname || '';
          var AUTH_PREFIXES = [
            '/login', '/register', '/signup', '/forgot', '/reset', '/otp',
            '/user/login', '/seller/login', '/admin/login',
            '/seller/register', '/seller/signup', '/seller/onboarding'
          ];
          var isAuthRoute = AUTH_PREFIXES.some(function (p) { return path.indexOf(p) === 0; });

          var stored = localStorage.getItem('theme');
          var resolved = isAuthRoute
            ? 'light'
            : (stored === 'dark' || stored === 'light' ? stored : 'light');

          if (resolved === 'dark') document.documentElement.classList.add('dark');
          else                     document.documentElement.classList.remove('dark');
          document.documentElement.dataset.theme = resolved;
        } catch (_) { /* localStorage blocked — fall back to light */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
