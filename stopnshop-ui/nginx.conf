server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Product and banner images are posted through this proxy to the API
    # (multipart: /api/seller/products/{id}/upload-images, /api/admin/cms/banners/upload-image).
    # nginx's default is 1m, which rejects an ordinary phone photo with 413 before
    # the request ever reaches the API. Keep in step with the edge vhost in deploy/nginx/.
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The edge terminates TLS, so without this the API only ever sees "http".
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dashboard and report queries outlive nginx's 60s default.
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
