name: Regression Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - integration

jobs:
  # ─────────────────────────────────────────────────────────
  # Regression Test Matrix
  # ─────────────────────────────────────────────────────────
  regression-matrix:
    name: Regression Tests - ${{ matrix.test-area }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Test filters map to FullyQualifiedName fragments because the test
          # methods do not carry [Trait("Category", ...)] attributes.
          - test-area: "Authentication"
            os: windows-latest
            test-filter: "FullyQualifiedName~Auth|FullyQualifiedName~Login"
          - test-area: "Orders"
            os: windows-latest
            test-filter: "FullyQualifiedName~Order"
          - test-area: "Cart & Checkout"
            os: windows-latest
            test-filter: "FullyQualifiedName~Cart|FullyQualifiedName~Checkout"
          - test-area: "Seller Operations"
            os: windows-latest
            test-filter: "FullyQualifiedName~Seller"
          - test-area: "Email Notifications"
            os: windows-latest
            test-filter: "FullyQualifiedName~Email|FullyQualifiedName~Notification"
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore StopNShop.sln

      - name: Build solution
        run: dotnet build StopNShop.sln --configuration Release --no-restore

      - name: Run regression tests - ${{ matrix.test-area }}
        # Point at the unit-test project (the only one that can run hermetically in CI),
        # filter by FQN substring. Empty filter result is fine — dotnet test reports
        # "No test matches the given filter" with exit 0, not a failure.
        run: dotnet test tests/StopNShop.Api.UnitTests/StopNShop.Api.UnitTests.csproj --configuration Release --no-build --filter "${{ matrix.test-filter }}" --verbosity normal --logger "trx;LogFileName=regression-${{ matrix.test-area }}.trx"
        continue-on-error: true

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ matrix.test-area }}
          path: |
            **/TestResults/
            **/*.trx

  # ─────────────────────────────────────────────────────────
  # Critical Path Tests
  # ─────────────────────────────────────────────────────────
  critical-path:
    name: Critical Path Tests
    runs-on: windows-latest
    # Requires a live SQL Server + running API — only fires on workflow_dispatch
    # (manual run from a test-env runner). Skipped on push/pull_request because
    # GitHub-hosted runners don't have SQL Express.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'stopnshop-ui/package-lock.json'

      - name: Build API
        run: |
          dotnet restore api/ShopNShop.Api.csproj
          dotnet build api/ShopNShop.Api.csproj --configuration Release

      - name: Start API
        run: |
          cd api
          Start-Process -NoNewWindow -FilePath dotnet -ArgumentList "run" -PassThru
          Start-Sleep -Seconds 5

      - name: Install UI dependencies
        run: |
          cd stopnshop-ui
          npm install

      - name: Build UI
        run: |
          cd stopnshop-ui
          npm run build

      - name: Verify API endpoints
        run: |
          $endpoints = @(
            "http://localhost:5000/api/products",
            "http://localhost:5000/api/categories",
            "http://localhost:5000/api/brands"
          )
          foreach ($endpoint in $endpoints) {
            try {
              $response = Invoke-WebRequest -Uri $endpoint -ErrorAction Stop
              Write-Host "✅ $endpoint - Status: $($response.StatusCode)"
            } catch {
              Write-Host "❌ $endpoint - Failed"
              exit 1
            }
          }

      - name: Verify UI build output
        run: |
          if (Test-Path "stopnshop-ui/dist") {
            Write-Host "✅ UI build output verified"
            Get-ChildItem "stopnshop-ui/dist" -Recurse | Measure-Object | Select-Object Count
          } else {
            Write-Host "❌ UI build output not found"
            exit 1
          }

  # ─────────────────────────────────────────────────────────
  # Regression Report
  # ─────────────────────────────────────────────────────────
  regression-report:
    name: Regression Report
    runs-on: ubuntu-latest
    needs: [regression-matrix, critical-path]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4

      - name: Generate regression report
        run: |
          echo "# Regression Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Regression Matrix: ${{ needs.regression-matrix.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Critical Path: ${{ needs.critical-path.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Test results available in workflow artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical tests failed
        # 'skipped' is treated as success — critical-path is workflow_dispatch only,
        # so PR runs always skip it. Only fail on a real failure.
        if: needs.critical-path.result == 'failure'
        run: |
          echo "❌ Critical path tests failed - blocking merge"
          exit 1
