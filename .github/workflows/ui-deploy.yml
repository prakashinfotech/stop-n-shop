name: UI Build Check

# Build/lint/test gate for the UI only. This workflow does NOT deploy.
# Deployment is owned entirely by deploy-main.yml, which builds the ui Docker
# image (baking VITE_API_URL) and restarts the stack on the self-hosted runner.
#
# The two `deploy-ui-*` jobs that used to live here were `echo` placeholders —
# they reported success without copying a single file, which made a broken
# production deploy look green. Do not reintroduce them.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'stopnshop-ui/**'
      - '.github/workflows/ui-deploy.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'stopnshop-ui/**'

jobs:
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'stopnshop-ui/package-lock.json'
      
      - name: Install dependencies
        run: cd stopnshop-ui && npm install
      
      - name: Run linter
        run: cd stopnshop-ui && npm run lint
        continue-on-error: true
      
      - name: Run tests
        run: cd stopnshop-ui && npm run test -- --run
        continue-on-error: true
      
      - name: Build
        run: cd stopnshop-ui && npm run build
      
      # Artifact is for inspecting a build, NOT for deploying. Copying this dist/
      # onto a web server by hand is exactly what caused the production outage:
      # a statically-served dist/ has no /api proxy, so POST /api/* returns 405.
      # Production is served by the ui Docker image via deploy-main.yml.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: stopnshop-ui/dist
