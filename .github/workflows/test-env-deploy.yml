name: Test Environment Deploy

# Deploy the `test` branch to the isolated test environment.
# Mirrors deploy.yml but targets a separate VPS (TEST_VPS_*) and a separate
# compose project so test traffic never touches production containers.

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build api/ShopNShop.Api.csproj -c Release

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stopnshop-ui/package-lock.json
      - name: Install
        run: npm install
        working-directory: stopnshop-ui
      - name: Build (test env)
        env:
          VITE_API_URL: ${{ secrets.TEST_API_URL }}
          VITE_ENV: test
        run: npm run build
        working-directory: stopnshop-ui

  deploy-test:
    name: Deploy to Test VPS
    needs: [build-api, build-ui]
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_VPS_HOST }}
          username: ${{ secrets.TEST_VPS_USER }}
          key: ${{ secrets.TEST_VPS_SSH_KEY }}
          script: |
            cd /opt/stopnshop-test
            git fetch origin test
            git checkout test
            git reset --hard origin/test
            # Use a distinct compose project so prod containers stay untouched.
            docker compose -p stopnshop-test -f docker-compose.yml up -d --build
            docker image prune -f
