name: Test Suite

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ─────────────────────────────────────────────────────────
  # Backend Unit Tests
  # ─────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (.NET)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore StopNShop.sln

      - name: Build solution
        run: dotnet build StopNShop.sln --configuration Release --no-restore

      - name: Run unit tests
        # Run ONLY the unit test project — integration tests need a live API on :5000 + a real DB,
        # neither of which CI provides. Integration suite is wired separately (and skipped in CI).
        run: dotnet test tests/StopNShop.Api.UnitTests/StopNShop.Api.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/TestResults/
            **/*.trx

      - name: Publish coverage reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: '**/coverage.cobertura.xml'
          flags: backend
          name: backend-coverage

  # ─────────────────────────────────────────────────────────
  # Frontend Unit Tests
  # ─────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'stopnshop-ui/package-lock.json'

      - name: Install dependencies
        run: |
          cd stopnshop-ui
          npm install

      - name: Run linter
        run: |
          cd stopnshop-ui
          npm run lint --if-present || true

      - name: Run tests
        run: |
          cd stopnshop-ui
          npm test -- --run --coverage 2>&1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            stopnshop-ui/coverage/
            stopnshop-ui/test-results/

      - name: Publish coverage reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: 'stopnshop-ui/coverage/coverage-final.json'
          flags: frontend
          name: frontend-coverage

  # ─────────────────────────────────────────────────────────
  # Build Verification
  # ─────────────────────────────────────────────────────────
  build-verify:
    name: Build Verification
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build API
        run: dotnet build api/ShopNShop.Api.csproj --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'stopnshop-ui/package-lock.json'

      - name: Install UI dependencies
        run: |
          cd stopnshop-ui
          npm install

      - name: Build UI
        run: |
          cd stopnshop-ui
          npm run build

  # ─────────────────────────────────────────────────────────
  # Code Quality Checks
  # ─────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd stopnshop-ui
          npm install

      - name: Run TypeScript checks
        run: |
          cd stopnshop-ui
          npx tsc --noEmit 2>&1 || true

      - name: Check for security vulnerabilities
        run: |
          cd stopnshop-ui
          npm audit --production --audit-level=moderate 2>&1 || true

  # ─────────────────────────────────────────────────────────
  # Test Summary
  # ─────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build-verify]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "::notice title=Test Results::Backend tests: ${{ needs.backend-tests.result }} | Frontend tests: ${{ needs.frontend-tests.result }} | Build verify: ${{ needs.build-verify.result }}"

      - name: Fail if tests failed
        if: |
          needs.backend-tests.result == 'failure' ||
          needs.frontend-tests.result == 'failure' ||
          needs.build-verify.result == 'failure'
        run: exit 1

